<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校園美食評分系統 - Standalone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        :root {
            --primary: #FFB800;
            --primary-soft: #FFF4D6;
            --secondary: #FF6B6B;
            --bg: #FDFCF0;
            --text-main: #2D3436;
            --text-muted: #636E72;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .primary-bg { background-color: var(--primary); }
        .secondary-bg { background-color: var(--secondary); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .card-done { opacity: 0.5; }
        .text-strike { text-decoration: line-through; }

        .btn-shadow {
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }
        .btn-shadow:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.1);
        }
        
        .vibrant-card {
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #EAEAEA;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .vibrant-card:hover {
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-feed { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="primary-bg px-6 sm:px-10 h-20 flex items-center justify-between shadow-md shrink-0 sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <div class="text-white text-2xl font-black tracking-wider flex items-center gap-2">
                <span>🍴</span>
                <span class="hidden sm:block">校園食評 Guide</span>
            </div>
        </div>

        <div class="flex-1 max-w-md mx-8 hidden md:block relative">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-white/70"></i>
            <input
                type="text"
                id="searchInput"
                placeholder="搜尋美食或餐廳..."
                class="w-full pl-12 pr-4 py-2 bg-white/30 border-none rounded-full text-white placeholder:text-white/70 focus:outline-none focus:ring-2 focus:ring-white/50 transition-all font-bold"
                oninput="renderList()"
            >
        </div>

        <div class="flex items-center gap-4">
            <div class="text-right hidden lg:block">
                <div class="text-white text-xs font-black opacity-70 uppercase tracking-tighter">Powered by</div>
                <div class="text-white text-sm font-black">LOCAL STORAGE</div>
            </div>
            <div class="w-10 h-10 rounded-full bg-white/30 flex items-center justify-center text-white border-2 border-white/20">
                <i class="fas fa-user"></i>
            </div>
        </div>
    </header>

    <!-- Filter Bar -->
    <nav class="bg-white px-6 sm:px-10 py-4 flex gap-4 border-b-2 border-gray-100 overflow-x-auto no-scrollbar shrink-0 shadow-sm sticky top-20 z-30">
        <button id="filter-all" onclick="setFilter('all')" class="px-6 py-2 rounded-full text-sm font-black whitespace-nowrap transition-all border-2 bg-primary border-primary text-white">全部食評</button>
        <button id="filter-good" onclick="setFilter('good')" class="px-6 py-2 rounded-full text-sm font-black whitespace-nowrap transition-all border-2 border-primary-soft text-text-muted hover:border-primary/40">👍 好評</button>
        <button id="filter-bad" onclick="setFilter('bad')" class="px-6 py-2 rounded-full text-sm font-black whitespace-nowrap transition-all border-2 border-primary-soft text-text-muted hover:border-primary/40">👎 差評</button>
        <button id="filter-other" onclick="setFilter('other')" class="px-6 py-2 rounded-full text-sm font-black whitespace-nowrap transition-all border-2 border-primary-soft text-text-muted hover:border-primary/40">💬 其他</button>
    </nav>

    <main class="flex-1 max-w-7xl mx-auto w-full px-6 sm:px-10 py-6 grid grid-cols-1 lg:grid-cols-[240px_1fr_280px] gap-8">
        
        <!-- Sidebar Left -->
        <aside class="hidden lg:flex flex-col gap-6 sticky top-[170px] h-fit">
            <button
                onclick="toggleModal(true)"
                class="secondary-bg text-white p-5 rounded-2xl font-black text-lg btn-shadow transition-all hover:brightness-110"
            >
                ✍️ 發表食評
            </button>
            <div class="bg-white p-6 rounded-2xl text-xs text-text-muted leading-relaxed border border-gray-100 shadow-sm">
                <strong class="text-text-main block mb-2 text-sm">💡 管理說明</strong>
                <p>資料儲存於本地紀錄。您可以標記「已吃過」來整理您的清單。<br><br><b>搜尋功能</b>：支援店名或菜名搜尋。</p>
            </div>
        </aside>

        <!-- Feed -->
        <div class="flex flex-col gap-6">
            <!-- Mobile Search -->
            <div class="md:hidden">
                <div class="relative">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-text-muted"></i>
                    <input
                        type="text"
                        id="searchInputMobile"
                        placeholder="搜尋美食..."
                        class="w-full pl-12 pr-4 py-4 bg-white border border-gray-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary font-bold shadow-sm"
                        oninput="document.getElementById('searchInput').value = this.value; renderList();"
                    >
                </div>
            </div>

            <!-- List -->
            <div id="recordsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-1 xl:grid-cols-2 gap-6 pb-20">
                <!-- Records injected here -->
            </div>
        </div>

        <!-- Sidebar Right -->
        <aside class="hidden lg:block sticky top-[170px] h-fit">
            <div class="bg-white p-6 rounded-[32px] border border-gray-100 shadow-sm">
                <h2 class="text-lg font-black mb-6 flex items-center gap-3">
                    <span class="text-2xl animate-bounce">🏆</span> 美食排行榜
                </h2>
                <div id="leaderboardList" class="space-y-5">
                    <!-- Leaderboard injected here -->
                </div>
            </div>
        </aside>
    </main>

    <!-- Mobile Action Button -->
    <button
        onclick="toggleModal(true)"
        class="lg:hidden fixed bottom-8 right-8 w-16 h-16 secondary-bg text-white rounded-full shadow-2xl flex items-center justify-center z-40 btn-shadow active:scale-95"
    >
        <i class="fas fa-plus text-2xl"></i>
    </button>

    <!-- Modal -->
    <div id="reviewModal" class="fixed inset-0 bg-black/40 backdrop-blur-md z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-[40px] shadow-2xl w-full max-w-lg overflow-hidden border border-white/20 animate-modal">
            <div class="p-6 primary-bg flex justify-between items-center text-white">
                <h2 class="text-xl font-black tracking-tight">✍️ 新增食評</h2>
                <button onclick="toggleModal(false)" class="w-10 h-10 hover:bg-white/20 rounded-full flex items-center justify-center text-xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form id="recordForm" class="p-8 space-y-6 max-h-[80vh] overflow-y-auto" onsubmit="handleFormSubmit(event)">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-text-muted uppercase tracking-[0.1em]">美食名稱</label>
                    <input required type="text" id="dishName" placeholder="例如：校園咖喱雞飯" class="w-full px-5 py-4 rounded-2xl bg-gray-50 border border-gray-100 focus:outline-none focus:ring-2 focus:ring-primary font-bold text-sm">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black text-text-muted uppercase tracking-[0.1em]">餐廳/入口</label>
                    <input required type="text" id="restaurantName" placeholder="例如：第一食堂" class="w-full px-5 py-4 rounded-2xl bg-gray-50 border border-gray-100 focus:outline-none focus:ring-2 focus:ring-primary font-bold text-sm">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-text-muted uppercase tracking-[0.1em]">分類</label>
                        <select id="category" class="w-full px-5 py-4 rounded-2xl bg-gray-50 border border-gray-100 focus:outline-none focus:ring-2 focus:ring-primary font-bold text-sm appearance-none cursor-pointer">
                            <option value="good">👍 好評</option>
                            <option value="bad">👎 差評</option>
                            <option value="other">💬 其他</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-text-muted uppercase tracking-[0.1em]">推薦程度</label>
                        <div class="flex items-center h-[54px] gap-2 px-5 bg-gray-50 rounded-2xl border border-gray-100" id="starRating">
                            <i class="fas fa-star text-primary cursor-pointer" onclick="setRating(1)"></i>
                            <i class="fas fa-star text-primary cursor-pointer" onclick="setRating(2)"></i>
                            <i class="fas fa-star text-primary cursor-pointer" onclick="setRating(3)"></i>
                            <i class="fas fa-star text-primary cursor-pointer" onclick="setRating(4)"></i>
                            <i class="fas fa-star text-primary cursor-pointer" onclick="setRating(5)"></i>
                        </div>
                        <input type="hidden" id="ratingValue" value="5">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black text-text-muted uppercase tracking-[0.1em]">評語內容</label>
                    <textarea required rows="4" id="content" placeholder="味道、價格、份量..." class="w-full px-5 py-4 rounded-2xl bg-gray-50 border border-gray-100 focus:outline-none focus:ring-2 focus:ring-primary resize-none font-bold text-sm"></textarea>
                </div>

                <div class="flex items-center gap-3">
                    <input type="checkbox" id="isAnonymous" checked class="w-6 h-6 accent-primary rounded-lg cursor-pointer">
                    <label for="isAnonymous" class="text-sm font-bold text-text-muted cursor-pointer">匿名發布</label>
                </div>

                <button type="submit" class="w-full secondary-bg text-white py-5 rounded-2xl font-black text-lg btn-shadow transition-all mt-4 hover:brightness-110 active:scale-95">
                    發布食評
                </button>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // 【技術限制】 6. JS 必須有 3 個分離 function
        
        let currentFilter = 'all';

        // 1. saveData(newRecord)
        function saveData(newRecord) {
            const records = loadData();
            records.push(newRecord);
            localStorage.setItem('records', JSON.stringify(records));
        }

        // 2. loadData()
        function loadData() {
            const rawData = localStorage.getItem('records');
            return rawData ? JSON.parse(rawData) : [];
        }

        // 3. renderList()
        function renderList() {
            const records = loadData();
            const search = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('recordsList');
            
            // Filtering & Searching
            let filtered = records.filter(r => {
                const matchesFilter = currentFilter === 'all' || r.category === currentFilter;
                const matchesSearch = (r.dishName || "").toLowerCase().includes(search) || 
                                    (r.restaurantName || "").toLowerCase().includes(search);
                return matchesFilter && matchesSearch;
            });

            // Sorting: 【排序】 active 排上面，done 排下面，然後按日期倒序
            filtered.sort((a, b) => {
                if (a.status === 'active' && b.status === 'done') return -1;
                if (a.status === 'done' && b.status === 'active') return 1;
                return new Date(b.createdAt) - new Date(a.createdAt);
            });

            // UI Rendering
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-24 bg-white rounded-[32px] border-4 border-dashed border-primary-soft">
                        <div class="text-6xl mb-4">🏜️</div>
                        <p class="text-text-muted font-black text-lg">暫無相關食評記錄</p>
                        <button onclick="toggleModal(true)" class="mt-4 text-primary font-bold hover:underline">立即撰寫第一條 →</button>
                    </div>
                `;
            } else {
                container.innerHTML = '';
                filtered.forEach((record, index) => {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = `vibrant-card bg-white rounded-[32px] p-6 relative flex flex-col group animate-feed ${record.status === 'done' ? 'card-done' : ''}`;
                    cardDiv.style.animationDelay = `${index * 0.05}s`;
                    
                    const catColors = {
                        good: 'bg-green-50 text-green-600',
                        bad: 'bg-red-50 text-red-600',
                        other: 'bg-blue-50 text-blue-600'
                    };
                    const catLabels = { good: '👍 好評', bad: '👎 差評', other: '💬 其他' };

                    cardDiv.innerHTML = `
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[10px] px-3 py-1.5 rounded-xl font-black uppercase tracking-wider ${catColors[record.category] || 'bg-gray-50 text-gray-400'}">
                                ${catLabels[record.category] || '食評'}
                            </span>
                            <button onclick="toggleStatus('${record.id}')" class="flex items-center gap-2 px-3 py-1.5 rounded-xl text-[10px] font-black transition-all ${record.status === 'done' ? 'bg-green-500 text-white' : 'bg-gray-100 text-text-muted hover:bg-gray-200'} shadow-sm">
                                <i class="fas fa-check-circle"></i>
                                ${record.status === 'done' ? '已吃過' : '我吃過了'}
                            </button>
                        </div>
                        <h3 class="text-lg font-black text-text-main mb-2 ${record.status === 'done' ? 'text-strike' : ''}">
                            ${record.restaurantName} - ${record.dishName}
                        </h3>
                        <p class="text-sm text-text-muted leading-relaxed mb-6 flex-1 line-clamp-4 ${record.status === 'done' ? 'text-strike' : ''}">
                            ${record.content}
                        </p>
                        <div class="flex items-center justify-between pt-5 border-t border-gray-50">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-primary-soft flex items-center justify-center text-primary font-black text-[10px] overflow-hidden border-2 border-white">
                                    <img src="https://api.dicebear.com/7.x/${record.isAnonymous ? 'bottts' : 'avataaars'}/svg?seed=${record.id}" alt="avatar">
                                </div>
                                <div class="text-[11px]">
                                    <div class="font-black text-text-main">${record.isAnonymous ? '匿名同學' : '美食愛好者'}</div>
                                    <div class="text-gray-300 font-bold">${new Date(record.createdAt).toLocaleDateString()}</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="deleteRecord('${record.id}')" class="w-8 h-8 rounded-full flex items-center justify-center text-red-200 hover:text-red-500 hover:bg-red-50 transition-all opacity-0 group-hover:opacity-100">
                                    <i class="fas fa-trash-alt text-xs"></i>
                                </button>
                                <button onclick="handleUpvote('${record.id}')" class="flex items-center gap-2 px-4 py-2 rounded-2xl text-xs font-black transition-all bg-primary-soft text-[#D48806] hover:bg-primary/20 active:scale-95 shadow-sm">
                                    <span class="text-sm">+${record.upvotes}</span>
                                    <span class="hidden sm:inline">認同</span>
                                </button>
                            </div>
                        </div>
                    `;
                    container.appendChild(cardDiv);
                });
            }
            renderLeaderboard(records);
        }

        // --- Helpers ---

        function toggleModal(show) {
            const modal = document.getElementById('reviewModal');
            modal.style.display = show ? 'flex' : 'none';
        }

        function setRating(val) {
            document.getElementById('ratingValue').value = val;
            const stars = document.getElementById('starRating').children;
            for(let i=0; i<5; i++) {
                stars[i].className = i < val ? 'fas fa-star text-primary cursor-pointer' : 'far fa-star text-gray-300 cursor-pointer';
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('nav button').forEach(btn => {
                const isMatch = btn.id === `filter-${filter}`;
                btn.className = `px-6 py-2 rounded-full text-sm font-black whitespace-nowrap transition-all border-2 ${isMatch ? 'bg-primary border-primary text-white' : 'border-primary-soft text-text-muted hover:border-primary/40'}`;
            });
            renderList();
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            
            // 【Data Schema 限制】 4. 每條記錄必須有以下欄位
            const newRecord = {
                id: Date.now() + "_" + Math.random().toString(36).slice(2,6), // id 生成規則
                createdAt: new Date().toISOString(), // createdAt
                dishName: document.getElementById('dishName').value,
                restaurantName: document.getElementById('restaurantName').value,
                category: document.getElementById('category').value,
                content: document.getElementById('content').value,
                rating: parseInt(document.getElementById('ratingValue').value),
                isAnonymous: document.getElementById('isAnonymous').checked,
                upvotes: 0,
                status: "active" // 【Data Schema 限制】 4. status 預設 "active"
            };

            saveData(newRecord);
            toggleModal(false);
            e.target.reset();
            setRating(5);
            renderList();
        }

        function toggleStatus(id) {
            const records = loadData();
            const idx = records.findIndex(r => r.id === id);
            if (idx !== -1) {
                // 【UI】 按下 status 由 active 變 done，再按變回 active
                records[idx].status = records[idx].status === 'done' ? 'active' : 'done';
                localStorage.setItem('records', JSON.stringify(records));
                renderList();
            }
        }

        function handleUpvote(id) {
            const records = loadData();
            const idx = records.findIndex(r => r.id === id);
            if (idx !== -1) {
                records[idx].upvotes++;
                localStorage.setItem('records', JSON.stringify(records));
                renderList();
            }
        }

        function deleteRecord(id) {
            if (!confirm('確定要刪除這條記錄嗎？')) return;
            const records = loadData();
            const filtered = records.filter(r => r.id !== id);
            localStorage.setItem('records', JSON.stringify(filtered));
            renderList();
        }

        function renderLeaderboard(records) {
            const container = document.getElementById('leaderboardList');
            const scores = {};
            
            records.forEach(r => {
                const key = `${r.restaurantName} - ${r.dishName}`;
                if (!scores[key]) scores[key] = { points: 0, upvotes: 0, count: 0 };
                scores[key].points += r.rating;
                scores[key].upvotes += r.upvotes;
                scores[key].count++;
            });

            const top = Object.keys(scores).map(key => ({
                name: key,
                total: (scores[key].points / scores[key].count) + (scores[key].upvotes * 0.5)
            })).sort((a, b) => b.total - a.total).slice(0, 5);

            if (top.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-300 font-bold italic py-4">目前尚無排行數據</p>';
                return;
            }

            container.innerHTML = '';
            top.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = "flex items-center gap-4 group";
                div.innerHTML = `
                    <div class="w-10 h-10 rounded-2xl flex items-center justify-center font-black text-sm bg-primary-soft text-primary group-hover:scale-110 transition-all shadow-sm shrink-0">
                        ${i + 1}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-black text-sm text-text-main truncate">${item.name}</div>
                        <div class="text-[9px] font-black text-primary uppercase tracking-[0.2em] opacity-60">熱度指數: ${item.total.toFixed(1)}</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.onload = () => renderList();
    </script>
</body>
</html>
